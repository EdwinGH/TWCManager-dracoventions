# TWCManager status - EXAMPLE FILE
#
# You do not have to create this file. TWCManager writes it by itself the first
# time one of the values below changes, starting from what is in
# TWCManager_config.json. Copy it only if you want to seed the running state,
# for example to carry a kWh total over from an older installation:
#
# Do not edit it while the service is running: it is rewritten atomically on
# every change and your version would be overwritten.
#
# The real file is state, not configuration. It changes continuously, so keep it
# out of version control (add it to .gitignore) along with the .ini.tmp file that
# appears next to it for a moment on every save.
#
# Everything here OVERRIDES the matching setting in TWCManager_config.json,
# which holds the value to start from. To go back to that starting value, stop
# TWCManager, delete the entry here (or the whole file), and start it again.

[settings]
# Amps offered when no charging schedule is active, -1 to track green
# energy. Set from the "(Non-scheduled) Power" dropdown on the web page.
nonScheduledAmpsMax = 6

[state]
# Running total of the energy delivered to cars, in kWh.
kWhDelivered = 0

[approvedVINs]
# Cars allowed to charge: VIN = expiry, where 0 means forever and any
# other number is a unix time. Set from the [always] / [24h] / [revoke]
# links on the web page. An empty section means nothing is approved.
# 5YJ3000000F000001 = 0
# 5YJS000000F000002 = 1793664000
